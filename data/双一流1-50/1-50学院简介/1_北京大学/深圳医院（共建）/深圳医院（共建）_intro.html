<!DOCTYPE html><html lang="en"><head>

    <title>404 Not Found</title>
    <style>
        html,body {height: 100%;}
        * {padding: 0;margin: 0;}
        .container {text-align: center;height: 100%; background-image: linear-gradient(to bottom,#fff,#F0F3FC);}

        .container .inner-container h1 {margin: 300px 0 40px;font-size: 150px;}

        .container .inner-container .button:hover {background: #50b590;color: #fff;}
    </style>
</head>
<body>
    <div class="container">
        <div class="inner-container">
            <h1>404</h1>
